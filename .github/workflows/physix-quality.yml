name: PhysiX — vérifications statiques
on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main
      - 'feat/**'
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check assets/app.js
          node --check assets/home.js
          node --check assets/catalogue.js
      - name: Check Supabase migration invariants
        run: python3 tests/check_supabase_migration.py
      - name: Check owner login callback integration
        run: python3 tests/check_admin_auth.py
      - name: Check owner auth script syntax
        run: node --check assets/admin-auth.js
      - name: Check owner content editor syntax
        run: node --check assets/admin-content.js
      - name: Check private PDF manager syntax
        run: node --check assets/admin-files.js
      - name: Check RLS-backed admin content invariants
        run: python3 tests/check_admin_content.py
      - name: Check Google Drive browser bridge syntax
        run: |
          node --check assets/drive-config.js
          node --check assets/admin-drive.js
          node --check assets/admin-simple.js
      - name: Check private Google Drive integration security
        run: python3 tests/check_google_drive_upload.py
      - name: Check student portal JavaScript syntax
        run: |
          node --check assets/eleve.js
          node --check assets/admin-students.js
      - name: Check student privacy and publication invariants
        run: python3 tests/check_student_portal.py
      - name: Check activity tracking JavaScript
        run: node --check assets/admin-tracking.js
      - name: Check private activity tracker and grade controls
        run: python3 tests/check_activity_tracker.py
      - name: Check student activation and class-board JavaScript
        run: |
          node --check assets/admin-pedagogy.js
          node --check assets/eleve-progress.js
          node --check assets/eleve.js
          node --check assets/admin-tracking.js
      - name: Check secure pupil onboarding and published classroom content
        run: python3 tests/check_pupil_onboarding.py
      - name: Check repository for accidental live credentials
        run: python3 tests/check_no_secrets.py
